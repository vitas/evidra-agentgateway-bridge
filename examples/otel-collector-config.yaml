receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  otlp_http/evidra_bridge:
    traces_endpoint: http://evidra-bridge:4318/v1/traces
    logs_endpoint: http://evidra-bridge:4318/v1/logs
    compression: none
    retry_on_failure:
      enabled: true
      initial_interval: 200ms
      max_interval: 1s
      max_elapsed_time: 5s

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/evidra_bridge]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/evidra_bridge]
