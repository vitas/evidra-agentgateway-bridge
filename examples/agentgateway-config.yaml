config:
  readinessAddr: 0.0.0.0:15021

frontendPolicies:
  tracing:
    host: otel-collector:4317
    randomSampling: true
    remove:
    - gen_ai.tool.call.arguments
    - gen_ai.tool.call.result
  accessLog:
    # Project only the explicit Evidra operation member. The bridge deliberately
    # does not parse or retain the complete baggage header.
    add:
      evidra_op: request.headers['baggage'].split('evidra.operation.id=')[1].split(',')[0]
    remove:
    - gen_ai.tool.call.arguments
    - gen_ai.tool.call.result
    otlp:
      host: otel-collector:4317

binds:
- port: 3000
  listeners:
  - routes:
    - backends:
      - mcp:
          targets:
          - name: everything
            stdio:
              cmd: mcp-server-everything
              args: ["stdio"]
