name: evidra-agentgateway-parity

services:
  evidra-bridge:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      EVIDRA_BRIDGE_MERGE_WAIT: "0"
      EVIDRA_BRIDGE_OBSERVATIONS: /data/observations.jsonl
      EVIDRA_BRIDGE_OBSERVER_ID: agentgateway-e2e
      EVIDRA_BRIDGE_OBSERVER_VERSION: "1.5.0"
    ports:
    - "127.0.0.1::4318"
    volumes:
    - ${EVIDRA_E2E_OUTPUT_DIR:?set EVIDRA_E2E_OUTPUT_DIR}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4318/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30

  otel-collector:
    image: docker.io/otel/opentelemetry-collector:0.160.0@sha256:e495787f07dbe432ce763ebaf5bc3d113850e9eee2250ade7a3da6a882d0d69a
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
    - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      evidra-bridge:
        condition: service_healthy

  agentgateway:
    build:
      context: ..
      dockerfile: examples/Dockerfile.agentgateway-test
    command: ["-f", "/etc/agentgateway/config.yaml"]
    ports:
    - "127.0.0.1::3000"
    volumes:
    - ./agentgateway-config.yaml:/etc/agentgateway/config.yaml:ro
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:15021/healthz/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 1s
      timeout: 2s
      retries: 45
