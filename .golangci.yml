version: "2"
linters:
  default: standard
  enable:
    - funlen
    - gocyclo
    - nestif
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
    funlen:
      lines: 130
      statements: 80
      ignore-comments: true
    gocyclo:
      min-complexity: 24
    nestif:
      min-complexity: 8
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - nestif
      # Task 8 hardens the sink close path and processor acknowledgement flow.
      # Keep those pre-existing findings explicit until that behavior changes.
      - path: internal/sink/jsonl\.go
        linters:
          - errcheck
      - path: internal/bridge/processor\.go
        linters:
          - gocyclo
      # This pre-existing declaration belongs to the OTLP integration fixture,
      # outside this repository-pipeline task's allowed file set.
      - path: internal/otlphttp/integration_test\.go
        linters:
          - staticcheck
